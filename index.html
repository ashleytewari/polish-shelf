<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Polish Shelf</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;font:500 16px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#ffe9f5;
  background:radial-gradient(ellipse at 70% 12%,#3a2f7a 0,transparent 55%),linear-gradient(180deg,#141a44,#2a1f52 70%,#3a2456)}
main{width:100%;max-width:360px;text-align:center}
.moon{width:54px;height:54px;border-radius:50%;margin:0 auto 18px;background:radial-gradient(circle at 35% 35%,#fffbe6,#f6e2a6);box-shadow:0 0 40px 8px rgba(255,236,170,.25)}
h1{margin:0 0 6px;font:800 30px/1.1 inherit;color:#ff8fc7;text-wrap:balance}
p{margin:0 0 22px;color:#d9c6ee;font-size:15px;text-wrap:pretty}
form{display:grid;gap:12px}
input[type=password],input[type=text]{width:100%;padding:13px 16px;border-radius:999px;border:2px solid #7d6ad0;background:#1f1640;color:#fff;font:inherit;text-align:center;outline:none}
input:focus-visible{border-color:#ff8fc7;box-shadow:0 0 0 3px rgba(255,143,199,.3)}
button{padding:13px 16px;border-radius:999px;border:0;background:linear-gradient(90deg,#ff7fbf,#c79bff);color:#2a1438;font:800 16px/1 inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
label.rem{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13.5px;color:#d9c6ee}
#msg{min-height:1.5em;margin-top:6px;font-size:14px;color:#ffb3c8}
</style></head><body><main>
<div class="moon" aria-hidden="true"></div>
<h1>Polish Shelf</h1>
<p>This shelf is private. Enter the password Ashley gave you.</p>
<form id="f"><input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Password" aria-label="Password" required>
<label class="rem"><input id="rem" type="checkbox" checked> Remember me on this device</label>
<button id="go" type="submit">Open the shelf</button></form>
<div id="msg" role="status" aria-live="polite"></div>
</main><script>
(()=>{   // wrapped so none of these names collide with the shelf page that replaces this one
const SALT=Uint8Array.from(atob("ruEpxN+y7rxzEK9Ne/xKgw=="),c=>c.charCodeAt(0)), ITER=310000;
const b64=u=>btoa(String.fromCharCode(...u)), unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const msg=t=>{document.getElementById("msg").textContent=t};
let BLOB=null; const shelf=()=>BLOB||(BLOB=fetch("shelf.enc").then(r=>{if(!r.ok) throw new Error("net"); return r.arrayBuffer()}).then(b=>new Uint8Array(b)));
async function open_(raw,remember){const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]); const buf=await shelf();
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},k,buf.slice(12));
  try{sessionStorage.setItem("psk",b64(raw)); if(remember) localStorage.setItem("psk",b64(raw))}catch(e){}
  const html=new TextDecoder().decode(pt); document.open(); document.write(html); document.close()}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault(); const go=document.getElementById("go"); go.disabled=true; msg("Opening\u2026");
  try{const pw=document.getElementById("pw").value.trim().toLowerCase();
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
    const raw=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:SALT,iterations:ITER,hash:"SHA-256"},km,256));
    await open_(raw,document.getElementById("rem").checked)}
  catch(err){go.disabled=false; msg(err&&err.message==="net"?"Couldn\u2019t load the shelf. Check your connection and try again.":"That password didn\u2019t work. Check with Ashley and try again.")}});
(async()=>{let s=""; try{s=sessionStorage.getItem("psk")||localStorage.getItem("psk")||""}catch(e){} if(!s) return; try{await open_(unb(s),false)}catch(e){try{sessionStorage.removeItem("psk");localStorage.removeItem("psk")}catch(_){}}})();
})();
</script></body></html>
